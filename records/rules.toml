n = 37
title = '''A name is probed before the text that uses it, and `el.sh` enforces it.'''
body = '''Before it runs Lean, `el.sh` reads the text (a scratch draft whole; a library module only on its lines changed against the order's base commit), with comments, docstrings and string literals removed, takes the identifiers that contain `.` or `_`, and refuses the run, logged `NOT RUN` with the tokens, while one is not cleared: by a successful `#check` probe of it or of a dot-prefix of it, or of a full name that ends in `.` and it (a name under `open`); by a first component that the text declares or binds (a hypothesis or a local); or by the hashed allowlist of tactic names. The order's own statement probes seed it. Refusing too much is safe: a probe clears it (order LEAN-30 used names in drafts before their `#check` probes again, its review r98's MAJOR and others: LEAN-30's close, thread 3).'''
subject = "names"
status = "active"
merged_into = 0
enforced_by = '''el.sh (refuses an unprobed name)'''
enforcement = "proposed"
verified_by = ""
last_caught = ""

[[rule]]
n = 38
title = '''A tool that imports `ClassicalLean` runs only on a fresh root build.'''
body = '''The bridge search, the report tool, the plan's checks with `--lean`, a census that imports the root, and any other tool that imports `ClassicalLean` run through a wrapper (order LEAN-32's `rootrun.sh`) that first runs `lake build` at the current HEAD under the memory cap, logs its rc, its job count and `git rev-parse HEAD`, and refuses the command, logged `NOT RUN`, unless that build's rc is 0. The gates are not wrapped; they run after gate 1's build. Tested before first use: with the build replaced by `false` the command is refused and not run; with the real build the build line comes before the command line, at the same HEAD (order LEAN-31's first bridge search and report tool run read a `ClassicalLean.olean` built before its new module existed, so both saw 128 modules and were void: its `misses.md` item 23).'''
subject = "build"
status = "active"
merged_into = 0
enforced_by = '''rootrun.sh (refuses unless a fresh root build passed)'''
enforcement = "proposed"
verified_by = ""
last_caught = ""

[[rule]]
n = 39
title = '''A commit is staged by path; its message is written after its gates have run, says only what the evidence log shows, and, when it cites runs, ends with a run citation written by script.'''
body = '''Stage every commit by path, branch commits included. Write a commit message only after its gates have run. Any linter or option switched off or on goes in the first paragraph of the commit message, and in §1. A commit message says only what the evidence log shows: a commit message that cites a run names its evidence label and claims only what that run's output shows, and every Mathlib or library name a proof uses that the order's own probes do not cover gets a logged `#check` probe before the first draft that uses it. Run citations in commit messages are written by script. After each commit a marker line `COMMIT <hash>` goes into `evidence.log`; a commit message that cites runs ends with one line written by a script (order LEAN-32's `evcite.py`), `Evidence: evidence.log lines N to M: <every label in those lines>`, covering every line since the last marker; and a checker (its `citecheck.py`) compares each commit's `Evidence:` line with the log and reports every difference, its output at the end of the push-review file (order LEAN-32, job 4e). Tested before first use: a message whose label list leaves one label out is reported; the generated line passes. Sources: order LEAN-31's commit messages named lists of runs that were not the whole list, its close, section 3.4, and `misses.md` items 10 to 14, 17 and 20 (rule 39); order LEAN-29's `2bba7b6` said item 92's names "were probed first (el.sh p92-1)", when that probe had failed on three names and two of the names used were never probed by `#check`, review r92, finding 4, and the fix commit `54c3624` restated it with a quotation cut without a mark and left out the run that confirmed the names, review r92c, findings A and B (rule 35); rules 4, 6 and 7.'''
subject = "commits"
status = "active"
merged_into = 0
enforced_by = '''evcite.py and citecheck.py'''
enforcement = "proposed"
verified_by = ""
last_caught = ""
change_note = '''RULES-1 J4: rules 4, 6, 7, 35 merged into rule 39, carrying out Dustin's ruling of 2026-10-18 (store row 20261018-010)'''
